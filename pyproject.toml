[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiuuv-link"
version = "0.1.0"
description = "Behavior-preserving modular extraction of the validated MultiUUV-Link prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3.0",
  "opencv-python>=4.10",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "pandas>=2.2",
  "torch",
  "imageio>=2.34",
  "pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["multiuuv_link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
